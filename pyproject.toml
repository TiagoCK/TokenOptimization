[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-spend-audit"
version = "0.1.0"
description = "Find cost inefficiencies in Anthropic Usage & Cost data, locally."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Intentionally empty, and it stays that way. A security-conscious user
# should be able to audit this project's entire dependency tree in five
# minutes; that is a feature, not an aesthetic preference. `rich` for the
# terminal renderer and `httpx` for the API path were both considered and
# declined: stdlib wrapping and urllib do the job, and an
# empty list is a stronger version of the property than a short one -- which
# matters most on the one path that asks for an org-wide admin key.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
claude-spend-audit = "claude_spend_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
